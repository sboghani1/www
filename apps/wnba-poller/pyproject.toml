[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wnba-poller"
version = "0.3.0"
description = "WNBA schedule, BetOnline line, and thought polling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-auth>=2.22,<3",
  "gspread>=6.1,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=22.0,<23",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
wnba-poller = "wnba_poller.cli:main"
wnba-guesser-bot = "wnba_poller.guesser_bot:main"
wnba-lean-workflow = "wnba_poller.lean_cli:main"
wnba-receptionist-helper = "wnba_poller.receptionist_helper:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wnba_poller*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
