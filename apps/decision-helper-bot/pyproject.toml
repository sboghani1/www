[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-helper-bot"
version = "0.1.0"
description = "Private Telegram decision journal for NFL and NBA picks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1,<2",
  "gspread>=6.1,<7",
  "httpx>=0.27,<1",
  "python-telegram-bot[job-queue]>=22.0,<23",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
decision-helper-bot = "decision_helper.bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_helper*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
