[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-receptionist"
version = "0.1.0"
description = "Private Telegram interface for coding agents on a VPS"
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.22,<3",
  "gspread>=6.1,<7",
  "psutil>=6.1,<8",
  "python-telegram-bot[job-queue]>=22.0,<23",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
telegram-receptionist = "receptionist.bot:main"
telegram-receptionist-bootstrap = "receptionist.bootstrap:main"
telegram-receptionist-health = "receptionist.health:main"
telegram-receptionist-maintenance = "receptionist.maintenance:main"
receptionist-nfl-history = "receptionist.nfl_history:main"
telegram-receptionist-watchdog = "receptionist.watchdog:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["receptionist*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
